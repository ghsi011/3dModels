        <meta name="description" content="If you find this useful, please consider buying me a coffee via the tip designer above.Fusion360 custom thread profile for soft drinks bottles (PCO1881 spec). Unzip to \Users\&quot;USERNAME&quot;\AppData\Local\Autodesk\webdeploy\production\&quot;CURRENT VERSION&quot;\Fusion\Server\Fusion\Configuration\ThreadData Note: You&#039;ll need to change &quot;USERNAME&quot; and &quot;CURRENT VERSION&quot; to match your own install. The current version should be the one with the latest date stamp.V2 internal thread (the &#039;cap&#039; thread) is a little tight and might need working on and off a few times, V3 is a bit looser. Neither will provide an air/watertight seal though so you&#039;ll need to model in a gasket or o-ring of some sort to stop it leaking.V4 and V5 use shallower thread angles and a whitworth thread. I&#039;ve not had chance to print and test them yet so use at your own risk. The documentation for creating a square thread via this process is sadly lacking, so I&#039;ve been unable to create a square profile thread. This is not a perfect recreation; the official thread spec calls for a more rounded square thread profile and the printed thread is triangular.Edit: If Fusion 360 updates and you no longer have the PCO threads listed in the thread tool you&#039;ll need to move them from the old  location to the new one. Both folder will be in the same place; \Users\&quot;USERNAME&quot;\AppData\Local\Autodesk\webdeploy\production\ just look at the creation dates of the folders to find the latest and previous ones.">
